spring:
  application:
    name: materialcrm-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:materialcrm}
    username: ${POSTGRES_USER:materialcrm}
    password: ${POSTGRES_PASSWORD:materialcrm}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: MaterialCRM API
    version: 0.1.0

